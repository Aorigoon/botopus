name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - name: Build Flutter APK
      run: |
        flutter create .
        sed -i 's/targetSdkVersion = flutter.targetSdkVersion/targetSdkVersion = 28/' android/app/build.gradle.kts
        sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 28/' android/app/build.gradle.kts
        flutter build apk --release
    - uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: build/app/outputs/flutter-apk/app-release.apk
